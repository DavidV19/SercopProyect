<main class="container">

  <section class="status-card">

    <h1>TenderVision AI</h1>

    <p>Public Procurement Analysis Platform</p>

    @if (loading()) {

      <p>Conectando con el servidor...</p>

    } @else if (error()) {

      <div class="error">
        {{ error() }}
      </div>

    } @else if (healthData(); as data) {

      <div class="status">
        <span class="indicator"></span>
        Backend conectado
      </div>

      <div class="details">
        <p>Application: {{ data.application }}</p>
        <p>Status: {{ data.status }}</p>
        <p>Version: {{ data.version }}</p>
      </div>

    }

    <button
      (click)="checkHealth()"
      [disabled]="loading()">
      Verificar conexión
    </button>

  </section>

</main>
